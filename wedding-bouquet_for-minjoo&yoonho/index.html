<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#e4dfd6">
  <title>Memory of Bouquet</title>
  <meta name="description" content="친구들의 마음이 담긴 디지털 부케 편지함">
  <meta property="og:title" content="Memory of Bouquet">
  <meta property="og:description" content="꽃을 눌러 친구들의 편지를 열어보세요 💐">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%90%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.min.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <canvas id="stage" aria-label="3D 부케 편지함"></canvas>

  <!-- 상단 -->
  <header id="topbar">
    <div class="brand">
      <h1 id="site-title">Memory of Bouquet</h1>
      <p id="site-sub"></p>
    </div>
    <div class="tools">
      <button id="btn-music" class="round" aria-label="음악 켜기/끄기" title="음악">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path class="note" d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle class="note" cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <circle class="note" cx="16.5" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path class="slash" d="M4 4l16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="btn-reset" class="round" aria-label="처음 시점으로" title="처음 시점으로">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 하단 진행/힌트 -->
  <footer id="bottombar">
    <div id="hint" class="pill">
      <span class="hint-ic">✋</span><span id="hint-text">드래그해서 돌려보고, 두 손가락으로 확대해요</span>
    </div>
    <button id="cta" class="cta" type="button">✍️ 편지 남기기</button>
  </footer>

  <div id="toast" role="status"></div>
  <div id="pops"></div>

  <!-- 편지 -->
  <section id="letter" class="sheet" aria-hidden="true">
    <div class="paper" id="paper">
      <i class="tape tape-l"></i><i class="tape tape-r"></i>
      <button class="x" id="letter-close" aria-label="닫기">×</button>
      <div class="view" id="letter-view">
        <div class="chip" id="letter-chip"></div>
        <p class="body" id="letter-body"></p>
        <div class="actions">
          <button class="write-btn" id="letter-write">✍️ 편지 쓰기</button>
          <button class="edit-btn" id="letter-edit">✏️ 수정하기</button>
        </div>
      </div>
      <form class="compose" id="letter-form" autocomplete="off" novalidate hidden>
        <label class="row">
          <span>From.</span>
          <input id="f-from" name="from" maxlength="20" placeholder="이름" required>
        </label>
        <textarea id="f-text" name="text" maxlength="1000" rows="6" placeholder="민주에게 마음을 남겨주세요 💌" required></textarea>
        <div class="count"><span id="f-len">0</span> / 1000</div>
        <label class="row pin">
          <span id="f-pin-label">비밀번호</span>
          <input id="f-pin" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="숫자 4자리">
        </label>
        <p class="hint-sm" id="f-pin-hint">초기 비밀번호는 <b>0000</b> 이에요</p>
        <div id="f-newpin-wrap">
          <label class="row pin">
            <span>새 비밀번호</span>
            <input id="f-newpin" name="newpin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="바꿀 때만">
          </label>
          <p class="hint-sm">비워두면 지금 비밀번호 그대로예요</p>
        </div>
        <p class="err" id="f-err" role="alert"></p>
        <div class="form-btns">
          <button type="button" class="ghost" id="f-cancel">취소</button>
          <button type="submit" class="save" id="f-save">저장하기</button>
        </div>
      </form>
      <div class="pager">
        <button id="letter-prev" aria-label="이전 편지">‹</button>
        <button id="letter-count" class="ind" type="button" aria-label="편지 목록 열기"></button>
        <button id="letter-next" aria-label="다음 편지">›</button>
      </div>
    </div>
  </section>

  <!-- 편지함 목록 -->
  <section id="picker" aria-hidden="true">
    <div class="pk-backdrop" id="pk-backdrop"></div>
    <div class="pk-panel" role="dialog" aria-label="편지함">
      <header class="pk-head">
        <h2>💐 편지함</h2>
        <span class="pk-count" id="pk-count"></span>
        <button class="pk-x" id="pk-close" aria-label="닫기">×</button>
      </header>
      <div class="pk-grid" id="pk-grid"></div>
    </div>
  </section>

  <!-- 사진 라이트박스 -->
  <section id="lightbox" aria-hidden="true">
    <div class="lb-backdrop"></div>
    <button class="x lb-x" id="lb-close" aria-label="닫기">×</button>
    <div class="lb-stage" id="lb-stage">
      <figure class="lb-card" id="lb-card">
        <i class="tape tape-t"></i>
        <img id="lb-img" alt="">
      </figure>
    </div>
    <button class="lb-nav lb-prev" id="lb-prev" aria-label="이전 사진">‹</button>
    <button class="lb-nav lb-next" id="lb-next" aria-label="다음 사진">›</button>
    <div class="lb-dots" id="lb-dots"></div>
  </section>

  <div id="loader">
    <div class="petals"><i></i><i></i><i></i><i></i><i></i></div>
    <p>부케를 다듬는 중이에요…</p>
  </div>

  <audio id="bgm" loop preload="metadata" playsinline></audio>

  <noscript><p style="position:fixed;inset:0;display:grid;place-items:center">이 페이지는 JavaScript가 필요해요.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
